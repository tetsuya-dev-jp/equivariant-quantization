[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eq-quant"
version = "0.1.0"
description = "Transformation-preserving language-model quantization pilot"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "torch",
  "transformers",
]

[project.scripts]
eq-quant = "eq_quant.cli:main"

[tool.setuptools.packages.find]
include = ["eq_quant*"]
